<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // หน้านี้ถูกโหลดใน DUI ของแต่ละจอ (1 จอ = 1 หน้า) รับคำสั่งผ่าน SendDuiMessage จาก client/main.lua
  //
  // sync: server ส่งมาแค่ "ตอนนี้วิดีโออยู่วินาทีที่ pos และกำลังเล่นหรือไม่"
  // หน้านี้จำเวลาที่รับข้อความไว้ (target.t) แล้วคำนวณตำแหน่งที่ควรเป็น ณ ตอนนี้เองทุกวินาที
  // ไม่ว่าจะโหลด YouTube ช้าแค่ไหน (คนเพิ่งเข้าเกม) หรือ buffer ค้าง ก็จะถูกดึงให้ตรงกับคนอื่น
  const DRIFT = 2.0;          // เหลื่อมเกินนี้ (วินาที) ถึงจะ seek
  const SEEK_COOLDOWN = 4000; // ms กัน seek รัว ๆ ตอนเน็ตช้า

  let player = null, ready = false, current = null, target = null;
  let lastSeek = 0, lastVol = null;

  function expected() {
    if (!target) return 0;
    return target.playing ? target.pos + (Date.now() - target.t) / 1000 : target.pos;
  }

  function seek(pos) {
    lastSeek = Date.now();
    player.seekTo(pos, true);
  }

  function sync() {
    if (!ready || !target) return;

    if (lastVol !== target.volume) {
      lastVol = target.volume;
      player.setVolume(target.volume);
      if (target.volume === 0) player.mute(); else player.unMute();
    }

    const pos = expected();

    if (current !== target.video) {
      current = target.video;
      if (target.playing) player.loadVideoById({ videoId: current, startSeconds: pos });
      else player.cueVideoById({ videoId: current, startSeconds: pos });
      lastSeek = Date.now();
      return;
    }

    const st = player.getPlayerState(); // -1 ยังไม่เริ่ม, 0 จบ, 1 เล่น, 2 หยุด, 3 buffer, 5 cued
    const dur = player.getDuration();
    // เลยความยาววิดีโอแล้ว (เช่นคนเข้าทีหลังตอนวิดีโอจบไปแล้ว) ไม่ต้อง seek ปล่อยให้ค้างที่จบ
    if (dur > 0 && pos >= dur - 0.5) {
      if (st === 1 || st === 3) player.pauseVideo();
      return;
    }

    const cooled = Date.now() - lastSeek > SEEK_COOLDOWN;
    if (target.playing) {
      if (st === 1 || st === 3) {
        if (cooled && Math.abs(player.getCurrentTime() - pos) > DRIFT) seek(pos);
      } else if (st === -1) {
        player.playVideo();
      } else { // 0, 2, 5
        seek(pos);
        player.playVideo();
      }
    } else {
      if (st === 1 || st === 3) player.pauseVideo();
      if (cooled && Math.abs(player.getCurrentTime() - pos) > 0.5) seek(pos);
    }
  }

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || d.type !== 'state') return;
    target = { video: d.video, pos: d.pos, playing: d.playing, volume: d.volume, t: Date.now() };
    sync();
  });

  setInterval(sync, 1000);

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width: '100%', height: '100%',
      playerVars: { origin: location.origin, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, iv_load_policy: 3, playsinline: 1, fs: 0 },
      events: {
        onReady: () => { ready = true; sync(); },
        onStateChange: () => sync(),
      },
    });
  }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
